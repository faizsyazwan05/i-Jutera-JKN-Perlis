<!DOCTYPE html>
<html lang="ms">
<head>

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #111a2e; }
    /* Bekas ini yang scroll, bukan iframe: lebih stabil di iOS Safari/PWA */
    #wrap { position: fixed; inset: 0; overflow: auto; -webkit-overflow-scrolling: touch; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <div id="wrap">
    <iframe src="https://script.google.com/a/macros/moh.gov.my/s/AKfycbyHO0-QhY9n4K14aV5vIFeWjN1OW9Pz428HCu-ILeQsiLJwKQro9FQNZO_KOX1P69XI/exec" allow="geolocation; microphone; camera"></iframe>
  </div>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
    }
  </script>
</body>
</html>
